[package]
name = "memory_p"
version = "0.3.0"
edition = "2021"
authors = ["MEMORY_P Team"]
description = "MEMORY_P v2.0 - Always-On MCP Toolkit with FFI + BRAIN"
license = "MIT"
keywords = ["mcp", "http", "memory", "brain", "rust"]
categories = ["development-tools", "utilities"]

[dependencies]
tokio = { version = "1.40", features = ["full"] }
futures = "0.3"
async-trait = "0.1"
async-stream = "0.3"
axum = "0.7"
tower = "0.4"
tower-http = { version = "0.5", features = ["trace", "cors"] }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
sqlx = { version = "0.8", features = ["runtime-tokio-native-tls", "postgres", "json"] }
sled = "0.34"
qdrant-client = "1.10"
tantivy = "0.25"
libloading = "0.8"
dashmap = "6.1"
parking_lot = "0.12"
rayon = "1.11"
num_cpus = "1.17"
scc = "2.4"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.22", features = ["v4", "v5", "serde"] }
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
prometheus = "0.13"
jwalk = "0.8"
walkdir = "2.4"
ignore = "0.4"
memmap2 = "0.9.9"
regex = "1.12"
clap = { version = "4.5", features = ["derive", "cargo"] }
colored = "2.1"
lazy_static = "1.4"
mimalloc = "0.1.48"
smallvec = "1.13"
smartstring = { version = "1.0", features = ["serde"] }
dotenv = "0.15"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
mockall = "0.14"
tokio-test = "0.4"
proptest = "1.11"

[[bench]]
name = "parallel_engine"
harness = false

[[bench]]
name = "vector_search"
harness = false

[[bench]]
name = "memory_operations"
harness = false

[[bin]]
name = "memory_p"
path = "src/main.rs"
# Orchestration server (HTTP) + all components

[[bin]]
name = "vector_engine"
path = "src/bin/vector_engine.rs"
# Qdrant, FAISS, SCANN

[[bin]]
name = "text_engine"
path = "src/bin/text_engine.rs"
# Tantivy, LNX, Toshi, MeiliSearch

[[bin]]
name = "specialized_engine"
path = "src/bin/specialized_engine.rs"
# Julia NLP, MemoryBank Ultra

[[bin]]
name = "jar"
path = "src/bin/jar.rs"
# DevOps CLI

[[bin]]
name = "mcp_server"
path = "src/bin/mcp_server.rs"
# MCP HTTP Server (port 4040)

[[bin]]
name = "motor_orchestrator"
path = "src/bin/motor_orchestrator.rs"
# Motor management CLI

[[bin]]
name = "jax_ml_engine"
path = "src/bin/jax_ml_engine.rs"
# JAX ML inference engine with real sentence-transformers (Port 9001)

[[bin]]
name = "mojo_search_engine"
path = "src/bin/mojo_search_engine.rs"
# Mojo SIMD vector engine with Rust fallback (Port 9002)

[[bin]]
name = "pony_actor_engine"
path = "src/bin/pony_actor_engine.rs"
# Pony actor system engine with Tokio fallback (Port 9003)

[[bin]]
name = "qdrant_search_engine"
path = "src/bin/qdrant_search_engine.rs"
# Qdrant semantic vector search (Motor 1)

[[bin]]
name = "faiss_search_engine"
path = "src/bin/faiss_search_engine.rs"
# FAISS GPU billions-scale search (Motor 2)

[[bin]]
name = "scann_search_engine"
path = "src/bin/scann_search_engine.rs"
# SCANN learned index trillions-scale (Motor 3)

[[bin]]
name = "tantivy_engine"
path = "src/bin/tantivy_engine.rs"
# Tantivy BM25 full-text (Motor 4)

[[bin]]
name = "lnx_cluster_engine"
path = "src/bin/lnx_cluster_engine.rs"
# LNX Raft distributed (Motor 5)

[[bin]]
name = "meilisearch_search_engine"
path = "src/bin/meilisearch_search_engine.rs"
# MeiliSearch typo-tolerant (Motor 6)

[[bin]]
name = "memorybank_orchestrator"
path = "src/bin/memorybank_orchestrator.rs"
# MemoryBank multi-language FFI coordinator (Motor 9)

[[bin]]
name = "julia_optimization_engine"
path = "src/bin/julia_optimization_engine.rs"
# Julia FFI: Weight optimization + NelderMead

[[bin]]
name = "chaos_analyzer"
path = "src/bin/chaos_analyzer.rs"
# Lyapunov exponents + bifurcation detection

[lib]
name = "memory_p"
path = "src/lib.rs"
crate-type = ["rlib"]

[profile.release]
opt-level = 2
lto = false
codegen-units = 8
strip = false
panic = "unwind"

[profile.bench]
inherits = "release"
opt-level = 2

[profile.dev]
opt-level = 0
debug = true

[features]
default = ["full"]
full = ["ffi-zig", "ffi-julia", "ffi-mojo", "ffi-jax", "ffi-pony"]
ffi-zig = []
ffi-julia = []
ffi-julia-chaos = ["ffi-julia"]
ffi-mojo = []
ffi-jax = []
ffi-pony = []
ffi-all = ["ffi-zig", "ffi-julia", "ffi-jax", "ffi-mojo", "ffi-pony"]

[build-dependencies]
cc = "1.0"
