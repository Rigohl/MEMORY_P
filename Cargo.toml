[package]
name = "memory_p"
version = "0.3.0"
edition = "2021"
authors = ["MEMORY_P Team"]
description = "MEMORY_P v2.0 - Always-On MCP Toolkit with FFI + BRAIN"
license = "MIT"
keywords = ["mcp", "http", "memory", "brain", "rust"]
categories = ["development-tools", "utilities"]

[dependencies]
tokio = { version = "1.51", features = ["full"] }
futures = "0.3"
async-trait = "0.1"
axum = "0.7"
tower = "0.4"
tower-http = { version = "0.5", features = ["trace", "cors"] }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
sqlx = { version = "0.8", features = ["runtime-tokio-native-tls", "postgres", "json"] }
sled = "0.34"
qdrant-client = "1.10"
tantivy = "0.25"
libloading = "0.8"
dashmap = "6.1"
parking_lot = "0.12"
rayon = "1.11"
num_cpus = "1.17"
scc = "2.4"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.23", features = ["v4", "v5", "serde"] }
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
prometheus = "0.13"
jwalk = "0.8"
walkdir = "2.4"
ignore = "0.4"
memmap2 = "0.9.9"
regex = "1.12"
clap = { version = "4.5", features = ["derive", "cargo"] }
colored = "2.1"
lazy_static = "1.4"
mimalloc = "0.1.48"
smallvec = "1.13"
smartstring = { version = "1.0", features = ["serde"] }
dotenv = "0.15"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
mockall = "0.14"
tokio-test = "0.4"
proptest = "1.11"

