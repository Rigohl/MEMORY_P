[package]
name = "memory_p"
version = "0.2.0"
edition = "2021"
description = "MCP Toolkit HTTP 2025: análisis, edición y reparación masiva para agentes"
authors = ["MEMORY_P Team"]
license = "MIT"
keywords = ["mcp", "http", "analysis", "rust"]
categories = ["development-tools", "utilities"]

[dependencies]
# Async & Web
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
futures = "0.3.31"
reqwest = { version = "0.11", features = ["json"] }
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }

# Parallelism & Concurrency
rayon = "1.11"
scc = "2.4"
dashmap = "6.1"
num_cpus = "1.17"
parking_lot = "0.12"

# Serialization (Zero-Copy)
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
toml = "0.9"

# MCP Protocol
mcp-sdk-rs = "0.3"
mcpkit-core = "0.5"

# Logging & Error Handling
tracing = "0.1"
tracing-subscriber = "0.3"
thiserror = "1.0"
anyhow = "1.0"
opentelemetry = { version = "0.21" }

# File & Path Operations (High Velocity)
jwalk = "0.8"
ignore = "0.4"
regex = "1.12"
tokenizers = "0.15"

# CLI & Parsing
clap = { version = "4.5", features = ["derive", "cargo"] }
colored = "3.1"
sqlparser = "0.50"

# Workspace & Memory
lazy_static = "1.4"
memmap2 = "0.9.9"
mimalloc = "0.1.48"
smallvec = "1.13"
smartstring = { version = "1.0", features = ["serde"] }
sled = "0.34"
polars = { version = "0.41", features = ["lazy", "parquet", "json"] }
aes-gcm = "0.10"
rand = "0.8"

# Database (optional for legacy support)
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json"], optional = true }

[[bin]]
name = "memory_p"
path = "src/main.rs"

[[bin]]
name = "jar"
path = "src/bin/jar.rs"

[dev-dependencies]
mockall = "0.14"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev]
opt-level = 1

[features]
default = ["ffi-all"]
# FFI Features (opcionales - el core funciona sin ellas)
ffi-zig = []
ffi-julia = []
ffi-jax = []
ffi-mojo = []
ffi-pony = []
ffi-all = ["ffi-zig", "ffi-julia", "ffi-jax", "ffi-mojo", "ffi-pony"]

[[example]]
name = "nuclear_crawler_demo"
path = "examples/nuclear_crawler_demo.rs"
