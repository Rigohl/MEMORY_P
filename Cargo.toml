[package]
name = "memory_p"
version = "0.2.0"
edition = "2021"
description = "MCP Toolkit HTTP 2025: análisis, edición y reparación masiva para agentes"
authors = ["MEMORY_P Team"]
license = "MIT"
keywords = ["mcp", "http", "analysis", "rust"]
categories = ["development-tools", "utilities"]

[dependencies]
# Async & Web
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
futures = "0.3.31"
reqwest = { version = "0.11", features = ["json"] }

# Parallelism & Concurrency
rayon = "1.11"
scc = "2.4"
dashmap = "6.1"
num_cpus = "1.17"

# Serialization (Zero-Copy)
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
toml = "0.9"

# MCP Protocol
mcp-sdk-rs = "0.3"
mcpkit-core = "0.5"

# Logging & Error Handling
tracing = "0.1"
tracing-subscriber = "0.3"
thiserror = "1.0"
anyhow = "1.0"

# Async Traits (for motores module)
async-trait = "0.1"

# Search Engines - Real Implementations
tantivy = "0.22"           # Full-text search engine
hnsw_rs = "0.3"            # HNSW for vector search

# Statistics & Optimization (Six Sigma)
statrs = "0.17"            # Statistical functions
ndarray = "0.16"           # N-dimensional arrays
ndarray-stats = "0.6"      # Statistics for ndarray

# Advanced Parallelism
crossbeam = "0.8"          # Advanced concurrency primitives
parking_lot = "0.12"       # Fast synchronization primitives

# File & Path Operations (High Velocity)
jwalk = "0.8"
ignore = "0.4"
regex = "1.10"

# Workspace & Memory
lazy_static = "1.4"
memmap2 = "0.9.9"
mimalloc = "0.1.48"

[dev-dependencies]
mockall = "0.14"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev]
opt-level = 1
