name: memory_p
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults

dependencies:
  # Python
  - python=3.11
  - pip
  
  # CUDA toolkit
  - cuda-toolkit=12.4
  - cudnn=8.9
  
  # JAX with CUDA support
  - pip:
      - jax[cuda12]==0.4.28
      - jaxlib[cuda12]==0.4.28
      - sentence-transformers==3.0.1
      - numpy>=1.26.0
      - scipy>=1.11.0
      - torch>=2.0.0
      - transformers>=4.35.0
      - accelerate>=0.25.0
      - optimum>=1.14.0
      
  # Build tools
  - cmake
  - make
  - gcc_linux-64
  - gxx_linux-64
  
  # Utilities
  - git
  - wget
  - curl
