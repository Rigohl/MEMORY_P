stages:
  - check
  - build
  - test
  - release

variables:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always

image: rust:1.94

cache:
  paths:
    - target/
    - .cargo/

before_script:
  - rustc --version && cargo --version

check:syntax:
  stage: check
  script:
    - echo "✓ Syntax check..."
    - cargo check --lib 2>&1 | tee check.log
  cache:
    paths:
      - target/
      - .cargo/
  allow_failure: true

build:lib:
  stage: build
  script:
    - echo "Building MEMORY_P v2.0 library..."
    - cargo build --release --lib 2>&1 | tee build.log
    - |
      if grep -q "^error" build.log; then
        ERROR_COUNT=$(grep -c "^error" build.log || echo "0")
        echo "❌ Build failed with $ERROR_COUNT errors"
        grep "^error\[" build.log | head -15
        exit 1
      else
        echo "✅ Library build successful"
      fi
  artifacts:
    paths:
      - target/release/*.rlib
      - target/release/*.so
      - target/release/*.dylib
      - build.log
    reports:
      junit: build.log
    expire_in: 2 weeks
  cache:
    paths:
      - target/
      - .cargo/

build:binaries:
  stage: build
  script:
    - echo "Building binaries..."
    - cargo build --release --bin memory_p 2>&1 || echo "⚠ memory_p skipped"
    - cargo build --release --bin mcp_server 2>&1 || echo "⚠ mcp_server skipped"
    - ls -lah target/release/memory_p* target/release/mcp* 2>/dev/null || echo "No binaries"
  artifacts:
    paths:
      - target/release/memory_p
      - target/release/mcp_server
    expire_in: 2 weeks
  allow_failure: true

test:unit:
  stage: test
  script:
    - echo "Running unit tests..."
    - cargo test --lib --release 2>&1 | head -100 || true
  allow_failure: true

docs:generate:
  stage: test
  script:
    - echo "Generating docs..."
    - cargo doc --no-deps --release 2>&1 | tail -50
  artifacts:
    paths:
      - target/doc/
    expire_in: 1 month
  allow_failure: true

release:package:
  stage: release
  script:
    - echo "Packaging release..."
    - mkdir -p dist
    - |
      for file in target/release/*.{rlib,so,dylib}; do
        [ -f "$file" ] && cp "$file" dist/ && echo "Packaged: $(basename $file)"
      done
    - du -sh dist/
  artifacts:
    paths:
      - dist/
    expire_in: 1 month
  only:
    - main
    - master
  allow_failure: true
