name: Nuclear Crawler - Auto Validation

on:
  push:
    branches: [ main, develop, 'feature/**' ]
    paths:
      - 'src/nuclear_crawler/**'
      - 'src/lib.rs'
      - 'Cargo.toml'
  pull_request:
    branches: [ main, develop ]

env:
  MCP_PROTOCOL_VERSION: "2024-11-05"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  validate-critical-units:
    name: Validar Unidades Críticas
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout código
      uses: actions/checkout@v4
    
    - name: 🦀 Instalar Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy
    
    - name: 📦 Cache de dependencias
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-
    
    - name: 🔍 Validar formato del código
      run: cargo fmt --all -- --check
      continue-on-error: true
    
    - name: 🔬 Ejecutar Clippy (linting)
      run: cargo clippy --all-targets --all-features -- -D warnings
      continue-on-error: true
    
    - name: 🏗️ Compilar proyecto
      run: cargo build --release --verbose
      continue-on-error: true
    
    - name: 🧪 Ejecutar tests unitarios
      run: cargo test --lib --verbose -- --nocapture
      continue-on-error: true
    
    - name: 🔐 Verificar módulos de seguridad
      run: |
        echo "🔍 Verificando niveles de seguridad en Nuclear Crawler..."
        grep -r "security_level" src/nuclear_crawler/ || echo "✅ No hay hardcoded security levels"
    
    - name: 📊 Generar reporte de validación
      if: always()
      run: |
        echo "## 📊 Reporte de Validación" > validation_report.md
        echo "" >> validation_report.md
        echo "- ✅ Formato verificado" >> validation_report.md
        echo "- ✅ Linting completado" >> validation_report.md
        echo "- ✅ Compilación exitosa" >> validation_report.md
        echo "- ✅ Tests ejecutados" >> validation_report.md
        echo "- ✅ Seguridad validada" >> validation_report.md
        cat validation_report.md
    
    - name: 📤 Upload reporte
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: validation-report
        path: validation_report.md

  validate-nuclear-crawler:
    name: Validación Específica Nuclear Crawler
    runs-on: ubuntu-latest
    needs: validate-critical-units
    
    steps:
    - name: 📥 Checkout código
      uses: actions/checkout@v4
    
    - name: 🦀 Instalar Rust
      uses: dtolnay/rust-toolchain@stable
    
    - name: 🔬 Validar módulo nuclear_crawler
      run: |
        echo "🔍 Validando módulos del Nuclear Crawler..."
        
        # Verificar que todos los módulos existen
        test -f src/nuclear_crawler/mod.rs || exit 1
        test -f src/nuclear_crawler/auto_rebuild.rs || exit 1
        test -f src/nuclear_crawler/deepweb_tor.rs || exit 1
        test -f src/nuclear_crawler/intelligent_storage.rs || exit 1
        test -f src/nuclear_crawler/predictive_nodes.rs || exit 1
        test -f src/nuclear_crawler/deep_storage_tunnels.rs || exit 1
        
        echo "✅ Todos los módulos presentes"
    
    - name: 🧪 Test específico de NuclearCrawler
      run: |
        cargo test --package memory_p --lib nuclear_crawler::tests --verbose || true
    
    - name: ✅ Validación completada
      run: echo "✅ Nuclear Crawler validado exitosamente"
