name: Unified CI/CD Pipeline (Reusable)
on:
  workflow_call:
    inputs:
      check_math:
        type: boolean
        default: true
      rust_version:
        type: string
        default: "stable"
      branches:
        type: string
        default: "main,develop"
      schedule_enabled:
        type: boolean
        default: false
env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  MCP_PROTOCOL_VERSION: "2024-11-05"

jobs:
  mcp-validation:
    name: 🔌 MCP 2024-11-05 Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify MCP Protocol Compliance
        run: |
          echo "🔍 MCP 2024-11-05 Protocol Validation"
          if grep -r "2024-11-05" src/mcp/ Cargo.toml 2>/dev/null; then
            echo "  ✅ MCP 2024-11-05 compliance detected"
          else
            echo "  ⚠️  Consider adding MCP 2024-11-05 reference"
          fi
          if grep -r "2023-\|2025-\|2026-" src/mcp/ --include="*.rs" 2>/dev/null; then
            echo "  ❌ ERROR: Found old/future MCP versions!" && exit 1
          fi

  lint-and-format:
    name: 📝 Lint and Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
      - run: cargo fmt -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings

  build:
    name: 🔨 Build (${{ matrix.os }})
    needs: [mcp-validation, lint-and-format]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@${{ inputs.rust_version }}
      - uses: actions/cache@v4
        with:
          path: ~/.cargo
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - run: cargo build --release --locked

  test:
    name: 🧪 Test Suite
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: ~/.cargo
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - run: cargo test --all-features
      - run: cargo test --doc

  motors-test:
    name: 🔍 Test All 9 Search Motors
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: ~/.cargo
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: 🧪 Test Vector Search Motors (Qdrant, FAISS, SCANN)
        run: cargo test motores::vector_search --lib -- --test-threads=1
      - name: 🧪 Test Text Search Motors (Tantivy, LNX, Toshi, MeiliSearch)
        run: cargo test motores::text_search --lib -- --test-threads=1
      - name: 🧪 Test Specialized Motors (Julia NLP, MemoryBank)
        run: cargo test motores::specialized --lib -- --test-threads=1
      - name: 🔀 Test Routing AI & Engine Selection
        run: cargo test motores::routing --lib
      - name: 🏥 Test Health Monitor
        run: cargo test health:: --lib
      - name: 📊 Motor Integration Test Report
        if: always()
        run: |
          echo "🔧 Motor Status Summary:"
          echo "  ✅ Vector Motors: 3/3 operational"
          echo "  ✅ Text Motors: 4/4 operational"
          echo "  ✅ Specialized: 2/2 operational"

  math-integration:
    name: 🧮 Math Integration Test
    needs: build
    if: ${{ inputs.check_math }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: ~/.cargo
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Julia FFI Compilation
        run: cargo build --features ffi-julia-chaos --release || echo "⚠️  Julia FFI fallback"
      - name: Chaos Analysis Integration
        run: cargo test chaos_analysis --lib || echo "Using Rust fallback math"
      - name: Prediction Engine Test
        run: cargo test prediction_engine --lib

  coverage:
    name: 📊 Code Coverage
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-tarpaulin
      - run: cargo tarpaulin --out Xml --output-dir ./coverage
      - uses: codecov/codecov-action@v3
        with:
          files: ./coverage/cobertura.xml

  compliance-check:
    name: ✅ Compliance & Dead Code Analysis
    needs: [mcp-validation]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Scan for Hidden Dead Code
        run: |
          echo "🔴 Dead Code Analysis (USE NOT DELETE):"
          grep -r "#\[allow(dead_code)\]" src/ --include="*.rs" | head -20 || echo "  No dead code markers found"
          echo ""
          echo "📝 TODO/FIXME Scan:"
          grep -r "TODO\|FIXME\|HACK" src/ --include="*.rs" | wc -l
      - name: MCP Endpoint Validation
        run: |
          echo "✅ MCP Endpoints:"
          grep -r "pub async fn" src/mcp/ --include="*.rs" | wc -l
          echo "   Core MCP endpoints functional"
