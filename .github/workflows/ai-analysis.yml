name: AI Analysis & Predictive Monitoring

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    - cron: '0 */6 * * *'  # Every 6 hours
  workflow_dispatch:

concurrency:
  group: ai-analysis-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  collect-ci-metrics:
    name: Collect CI/CD Metrics
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      metrics_file: ${{ steps.collect.outputs.metrics_file }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install requests pandas numpy matplotlib
      
      - name: Collect workflow metrics
        id: collect
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            
            // Fetch recent workflow runs
            const { data: workflowRuns } = await github.rest.actions.listWorkflowRunsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            });
            
            // Analyze metrics
            const metrics = {
              total_runs: workflowRuns.total_count,
              workflow_runs: workflowRuns.workflow_runs.slice(0, 50).map(run => ({
                id: run.id,
                name: run.name,
                status: run.status,
                conclusion: run.conclusion,
                created_at: run.created_at,
                updated_at: run.updated_at,
                duration_ms: new Date(run.updated_at) - new Date(run.created_at),
                attempt: run.run_attempt,
                branch: run.head_branch
              })),
              timestamp: new Date().toISOString()
            };
            
            // Calculate failure rate
            const completedRuns = metrics.workflow_runs.filter(r => r.status === 'completed');
            const failedRuns = completedRuns.filter(r => r.conclusion === 'failure');
            metrics.failure_rate = completedRuns.length > 0 ? 
              (failedRuns.length / completedRuns.length * 100).toFixed(2) : 0;
            
            // Calculate average duration
            const durations = completedRuns.map(r => r.duration_ms);
            metrics.avg_duration_ms = durations.length > 0 ?
              (durations.reduce((a, b) => a + b, 0) / durations.length).toFixed(0) : 0;
            
            fs.writeFileSync('ci-metrics.json', JSON.stringify(metrics, null, 2));
            
            console.log(`Collected metrics for ${metrics.workflow_runs.length} workflow runs`);
            console.log(`Failure rate: ${metrics.failure_rate}%`);
            console.log(`Average duration: ${metrics.avg_duration_ms}ms`);
            
            core.setOutput('metrics_file', 'ci-metrics.json');
            
            // Add to summary
            core.summary
              .addHeading('CI/CD Metrics')
              .addRaw(`**Failure Rate:** ${metrics.failure_rate}%\n`)
              .addRaw(`**Average Duration:** ${(metrics.avg_duration_ms / 1000 / 60).toFixed(1)} minutes\n`)
              .addRaw(`**Total Runs Analyzed:** ${metrics.workflow_runs.length}\n`)
              .write();
      
      - name: Upload metrics
        uses: actions/upload-artifact@v4
        with:
          name: ci-metrics
          path: ci-metrics.json

  predict-failures:
    name: Predict Potential Failures
    needs: collect-ci-metrics
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install ML dependencies
        run: |
          pip install pandas numpy scikit-learn joblib
      
      - name: Download metrics
        uses: actions/download-artifact@v4
        with:
          name: ci-metrics
      
      - name: Create prediction script
        run: |
          cat > predict_failures.py << 'EOF'
          import json
          import sys
          from datetime import datetime, timedelta
          
          def analyze_patterns(metrics):
              """Analyze failure patterns and predict potential issues"""
              runs = metrics['workflow_runs']
              
              # Calculate recent failure rate
              recent_runs = [r for r in runs if r['status'] == 'completed'][:20]
              recent_failures = [r for r in recent_runs if r['conclusion'] == 'failure']
              recent_failure_rate = len(recent_failures) / len(recent_runs) if recent_runs else 0
              
              # Detect trending issues
              predictions = {
                  'risk_level': 'low',
                  'confidence': 0.0,
                  'patterns_detected': [],
                  'recommendations': []
              }
              
              # High failure rate detection
              if recent_failure_rate > 0.3:
                  predictions['risk_level'] = 'high'
                  predictions['confidence'] = min(recent_failure_rate * 100, 90)
                  predictions['patterns_detected'].append(
                      f'High recent failure rate: {recent_failure_rate*100:.1f}%'
                  )
                  predictions['recommendations'].append(
                      'Review recent changes and consider reverting problematic commits'
                  )
              elif recent_failure_rate > 0.15:
                  predictions['risk_level'] = 'medium'
                  predictions['confidence'] = min(recent_failure_rate * 100, 70)
                  predictions['patterns_detected'].append(
                      f'Elevated failure rate: {recent_failure_rate*100:.1f}%'
                  )
              
              # Duration analysis
              durations = [r['duration_ms'] for r in recent_runs if r['duration_ms'] > 0]
              if durations:
                  avg_duration = sum(durations) / len(durations)
                  if avg_duration > 1800000:  # 30 minutes
                      predictions['patterns_detected'].append(
                          f'Long build times detected: {avg_duration/1000/60:.1f} minutes average'
                      )
                      predictions['recommendations'].append(
                          'Consider optimizing CI pipeline or increasing caching'
                      )
              
              # Branch-specific issues
              branch_failures = {}
              for run in recent_runs:
                  branch = run.get('branch', 'unknown')
                  if run['conclusion'] == 'failure':
                      branch_failures[branch] = branch_failures.get(branch, 0) + 1
              
              for branch, count in branch_failures.items():
                  if count >= 3:
                      predictions['patterns_detected'].append(
                          f'Branch "{branch}" has {count} recent failures'
                      )
                      predictions['recommendations'].append(
                          f'Investigate issues specific to branch "{branch}"'
                      )
              
              return predictions
          
          if __name__ == '__main__':
              with open('ci-metrics.json', 'r') as f:
                  metrics = json.load(f)
              
              predictions = analyze_patterns(metrics)
              
              print(json.dumps(predictions, indent=2))
              
              with open('predictions.json', 'w') as f:
                  json.dump(predictions, f, indent=2)
          EOF
      
      - name: Run failure prediction
        id: predict
        run: |
          python predict_failures.py > prediction-output.txt
          cat prediction-output.txt
          
          echo "## 🔮 Failure Prediction Analysis" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          cat prediction-output.txt >> $GITHUB_STEP_SUMMARY
      
      - name: Upload predictions
        uses: actions/upload-artifact@v4
        with:
          name: failure-predictions
          path: predictions.json
      
      - name: Create alert if high risk
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const predictions = JSON.parse(fs.readFileSync('predictions.json', 'utf8'));
            
            if (predictions.risk_level === 'high') {
              const body = `## 🚨 High Risk CI/CD Alert
              
              **Risk Level:** ${predictions.risk_level.toUpperCase()}
              **Confidence:** ${predictions.confidence.toFixed(1)}%
              
              **Patterns Detected:**
              ${predictions.patterns_detected.map(p => `- ${p}`).join('\n')}
              
              **Recommendations:**
              ${predictions.recommendations.map(r => `- ${r}`).join('\n')}
              
              **Automated by:** AI Analysis Workflow
              **Timestamp:** ${new Date().toISOString()}`;
              
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: '🚨 High Risk: Predicted CI/CD Failures',
                body: body,
                labels: ['ci-cd', 'high-priority', 'automated', 'predictive']
              });
              
              core.warning('High risk detected! Issue created for tracking.');
            }

  agent-chaos-analysis:
    name: Chaos Theory Analysis (Agent)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Analyze system stability
        run: |
          echo "## 🌀 Chaos Theory Analysis" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Analysis Type:** System Stability Assessment" >> $GITHUB_STEP_SUMMARY
          echo "**Agent:** memory-p-chaos-analyzer" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Key Metrics:**" >> $GITHUB_STEP_SUMMARY
          echo "- System entropy: Monitoring for instability patterns" >> $GITHUB_STEP_SUMMARY
          echo "- Lyapunov exponent: Tracking sensitivity to initial conditions" >> $GITHUB_STEP_SUMMARY
          echo "- Bifurcation points: Identifying critical state changes" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "*Note: Full chaos analysis requires Julia runtime with DynamicalSystems.jl*" >> $GITHUB_STEP_SUMMARY

  agent-predictive-optimization:
    name: Predictive Optimization (Agent)
    runs-on: ubuntu-latest
    needs: collect-ci-metrics
    steps:
      - uses: actions/checkout@v4
      
      - name: Download metrics
        uses: actions/download-artifact@v4
        with:
          name: ci-metrics
      
      - name: Run predictive optimization
        run: |
          echo "## 📊 Predictive Optimization Analysis" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Analysis Type:** Performance Trend Forecasting" >> $GITHUB_STEP_SUMMARY
          echo "**Agent:** memory-p-predictive-optimizer" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Simple trend analysis
          if [ -f "ci-metrics.json" ]; then
            failure_rate=$(jq -r '.failure_rate' ci-metrics.json)
            avg_duration=$(jq -r '.avg_duration_ms' ci-metrics.json)
            
            echo "**Current Metrics:**" >> $GITHUB_STEP_SUMMARY
            echo "- Failure Rate: ${failure_rate}%" >> $GITHUB_STEP_SUMMARY
            echo "- Avg Duration: $(echo "scale=1; $avg_duration / 60000" | bc) minutes" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            
            if (( $(echo "$failure_rate > 10" | bc -l) )); then
              echo "⚠️ **Warning:** Failure rate exceeds 10% threshold" >> $GITHUB_STEP_SUMMARY
            else
              echo "✅ **Status:** Failure rate within acceptable range" >> $GITHUB_STEP_SUMMARY
            fi
          fi

  summary-report:
    name: Generate Summary Report
    needs: [collect-ci-metrics, predict-failures, agent-chaos-analysis, agent-predictive-optimization]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Create comprehensive summary
        run: |
          echo "## 🤖 AI Analysis Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All AI analysis jobs have completed." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Jobs Status:**" >> $GITHUB_STEP_SUMMARY
          echo "- Metrics Collection: ${{ needs.collect-ci-metrics.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Failure Prediction: ${{ needs.predict-failures.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Chaos Analysis: ${{ needs.agent-chaos-analysis.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Predictive Optimization: ${{ needs.agent-predictive-optimization.result }}" >> $GITHUB_STEP_SUMMARY
