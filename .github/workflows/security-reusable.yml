name: Security Scanning & Compliance (Reusable)

on:
  workflow_call:
    inputs:
      audit_level:
        description: 'Audit depth (standard/deep/full)'
        type: string
        default: 'standard'
      mcp_validate:
        description: 'Validate MCP 2024-11-05 compliance'
        type: boolean
        default: true
      python_security:
        description: 'Run Python security checks'
        type: boolean
        default: false

env:
  MCP_PROTOCOL_VERSION: "2024-11-05"
  RUST_VERSION: "1.94"

jobs:
  mcp-compliance:
    name: 🔌 MCP 2024-11-05 Compliance Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ inputs.mcp_validate }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify MCP Protocol Version
        run: |
          if grep -r "2024-11-05" src/mcp/ 2>/dev/null | head -1; then
            echo "✅ MCP 2024-11-05 compliance verified"
          else
            echo "⚠️ MCP version reference missing"
          fi
      - name: Reject Old Versions
        run: |
          if grep -r "2023-\|2025-\|2026-" src/mcp/ --include="*.rs"; then
            echo "❌ ERROR: Old protocol versions detected"
            exit 1
          fi

  cargo-audit:
    name: 📦 Cargo Security Audit
    runs-on: ubuntu-latest
    needs: [mcp-compliance]
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run cargo-audit
        run: |
          cargo install cargo-audit
          cargo audit --deny warnings || true
      - name: Run cargo-deny
        run: |
          cargo install cargo-deny
          cargo deny check advisories || true

  codeql:
    name: 🔐 CodeQL Security Analysis
    runs-on: ubuntu-latest
    needs: [mcp-compliance]
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v2
        with:
          languages: 'cpp'
      - uses: github/codeql-action/autobuild@v2
      - uses: github/codeql-action/analyze@v2

  container-security:
    name: 🐳 Container Security Scan
    runs-on: ubuntu-latest
    needs: [mcp-compliance]
    steps:
      - uses: actions/checkout@v4
      - name: Build image for scanning
        run: docker build -t memory-p:test . || true
      - name: Run Trivy scan
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy image memory-p:test || true

  python-security:
    name: 🐍 Python Dependencies Check
    runs-on: ubuntu-latest
    needs: [mcp-compliance]
    if: ${{ inputs.python_security }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install bandit
        run: pip install bandit
      - name: Run bandit on Python code
        run: bandit -r brain/python/ || true

  summary:
    name: 📊 Security Summary
    runs-on: ubuntu-latest
    needs: [cargo-audit, codeql, container-security]
    if: always()
    steps:
      - name: Report Results
        run: |
          echo "## Security Scan Complete"
          echo "- Cargo Audit: ${{ needs.cargo-audit.result }}"
          echo "- CodeQL: ${{ needs.codeql.result }}"
          echo "- Container: ${{ needs.container-security.result }}"
