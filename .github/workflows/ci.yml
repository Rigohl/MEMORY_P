name: CI - Build and Test

on:
  push:
    branches: [ main, develop, 'copilot/**' ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  lint:
    name: Lint and Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          components: rustfmt, clippy
          override: true

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v5
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-git-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache target directory
        uses: actions/cache@v5
        with:
          path: target
          key: ${{ runner.os }}-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Run rustfmt
        run: cargo fmt -- --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true

      - name: Cache dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build
        run: cargo build --release --locked

      - name: Upload artifacts
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v6
        with:
          name: memory_p-${{ runner.os }}
          path: target/release/memory_p
          retention-days: 7

  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: memory_p
          POSTGRES_PASSWORD: memory_p_password
          POSTGRES_DB: memory_p_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true

      - name: Cache dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}

      - name: Run tests
        run: cargo test --all-features
        env:
          DATABASE_URL: postgresql://memory_p:memory_p_password@localhost:5432/memory_p_test
          REDIS_URL: redis://localhost:6379

      - name: Run doc tests
        run: cargo test --doc

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          name: memory_p-Linux

      - name: Make binary executable
        run: chmod +x memory_p

      - name: Start services with docker-compose
        run: |
          docker-compose up -d postgres redis qdrant meilisearch
          sleep 10

      - name: Check services health
        run: |
          docker-compose ps
          curl -f http://localhost:6333/health || exit 1
          curl -f http://localhost:7700/health || exit 1

      - name: Run integration tests
        run: |
          # Start MEMORY_P in background
          ./memory_p &
          MEMORY_P_PID=$!
          sleep 5
          
          # Test health endpoint
          curl -f http://localhost:4040/health || exit 1
          
          # Cleanup
          kill $MEMORY_P_PID

      - name: Stop services
        if: always()
        run: docker-compose down

  motor-engine-tests:
    name: 🔍 Test All 9 Search Motors
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: memory_p
          POSTGRES_PASSWORD: memory_p
          POSTGRES_DB: memory_p_test
        ports:
          - 5432:5432
      qdrant:
        image: qdrant/qdrant:latest
        ports:
          - 6333:6333
      meilisearch:
        image: getmeili/meilisearch:latest
        ports:
          - 7700:7700
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-motors-${{ hashFiles('**/Cargo.lock') }}
      
      - name: 🧪 Test Vector Search Motors (Qdrant, FAISS, SCANN)
        run: |
          echo "════════════════════════════════════════"
          echo "  VECTOR SEARCH MOTORS TEST"
          echo "════════════════════════════════════════"
          cargo test motores::vector_search:: --lib -- --nocapture
        env:
          QDRANT_URL: http://localhost:6333

      - name: 🧪 Test Text Search Motors (Tantivy, LNX, Toshi, MeiliSearch)
        run: |
          echo "════════════════════════════════════════"
          echo "  TEXT SEARCH MOTORS TEST"
          echo "════════════════════════════════════════"
          cargo test motores::text_search:: --lib -- --nocapture
        env:
          MEILISEARCH_URL: http://localhost:7700

      - name: 🧪 Test Specialized Motors (Julia NLP, MemoryBank)
        run: |
          echo "════════════════════════════════════════"
          echo "  SPECIALIZED MOTORS TEST"
          echo "════════════════════════════════════════"
          cargo test motores::specialized:: --lib -- --nocapture

      - name: 🔀 Test Routing AI & Engine Selection
        run: |
          echo "════════════════════════════════════════"
          echo "  ROUTING AI TEST"
          echo "════════════════════════════════════════"
          cargo test motores::core::routing_ai:: --lib -- --nocapture

      - name: 🏥 Test Health Monitor
        run: |
          echo "════════════════════════════════════════"
          echo "  HEALTH MONITOR TEST"
          echo "════════════════════════════════════════"
          cargo test motores::core::health_monitor:: --lib -- --nocapture

      - name: 🔗 Test Fusion Engine (Hybrid Search)
        run: |
          echo "════════════════════════════════════════"
          echo "  FUSION ENGINE TEST"
          echo "════════════════════════════════════════"
          cargo test motores::hybrid:: --lib -- --nocapture

      - name: 📊 Motor Integration Test Report
        if: always()
        run: |
          echo "✅ All 9 motors tested for correctness and SLA compliance"

  code-patterns-analysis:
    name: Smart Code Pattern Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Analyze for code duplication
        run: |
          echo "🔍 Detecting duplicate patterns in src/..."
          # Look for similar functions and structures
          find src -name "*.rs" | head -20 | xargs wc -l | sort -rn | head -10

      - name: Check FFI/BRAIN usage patterns
        run: |
          echo "🧠 Analyzing FFI + BRAIN integration..."
          echo "FFI modules available:"
          ls -la src/ffi/ | grep ".rs"
          echo "BRAIN implementations:"
          ls -la brain/ | grep -E "\.jl|\.mojo|\.pony|\.py"
          
      - name: Verify MCP protocol endpoints
        run: |
          echo "🔌 MCP Protocol Status:"
          grep -n "2026-11-05\|MCP_PROTOCOL_VERSION" src/mcp/http_server.rs || echo "⚠️  MCP version check needed"
          
      - name: Motor Architecture Analysis
        run: |
          echo "🚀 Motor Architecture Status:"
          echo "Available engines: $(cargo build --release --all-features 2>&1 && echo 'Build OK' || echo 'Build FAILED')"
          grep -c "impl SearchEngine" src/motores/**/*.rs 2>/dev/null | xargs echo "SearchEngine implementations:"
          grep -c "pub fn route_query" src/motores/core/routing_ai.rs | xargs echo "Routing AI functions:"
          
      - name: Upload pattern analysis
        uses: actions/upload-artifact@v6
        with:
          name: code-patterns-report
          path: |
            *.txt
            *.md
          retention-days: 7
        continue-on-error: true

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true

      - name: Install tarpaulin
        run: cargo install cargo-tarpaulin

      - name: Generate coverage
        run: cargo tarpaulin --out Xml --output-dir ./coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage/cobertura.xml
          flags: unittests
          name: codecov-umbrella
