name: Build All 8 Binaries Cloud

on:
  push:
    branches:
      - main
      - master
    paths:
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "build.rs"
      - ".github/workflows/build-all-binaries.yml"
  
  pull_request:
    branches:
      - main
      - master
    types:
      - opened
      - synchronize
      - reopened
  
  workflow_dispatch:

jobs:
  build:
    name: Compile All 8 Binaries
    runs-on: ubuntu-latest
    timeout-minutes: 45
    
    strategy:
      fail-fast: false
      matrix:
        include:
          - bin: memory_p
            desc: Main MEMORY_P binary
          - bin: motor_orchestrator
            desc: 9-Motor Orchestrator rayon
          - bin: sql_executor
            desc: SQL Executor DDL DML regex
          - bin: memory_manager
            desc: Memory Manager sled TTL
          - bin: mcp_server
            desc: MCP Server session routing
          - bin: neural_crawler
            desc: Neural Crawler memmap2
          - bin: jar
            desc: JAR CLI rayon
          - bin: dead_code_activator
            desc: Dead Code Activator

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.0
          components: rustfmt, clippy

      - name: Cache Rust deps
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Verify Cargo
        run: cargo metadata --format-version 1 > /dev/null

      - name: Check all features
        run: cargo check --release --all-features

      - name: Build ${{ matrix.bin }}
        run: |
          cargo build --release --bin ${{ matrix.bin }} --locked 2>&1 | tee build_${{ matrix.bin }}.log

      - name: Verify binary
        run: |
          BINARY="target/release/${{ matrix.bin }}"
          [ -f "$BINARY" ] && ls -lh "$BINARY" || (echo "FAILED"; exit 1)

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.bin }}-ubuntu
          path: target/release/${{ matrix.bin }}
          retention-days: 7

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: log-${{ matrix.bin }}
          path: build_${{ matrix.bin }}.log
          retention-days: 5

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.0
      - uses: Swatinem/rust-cache@v2

      - name: Unit tests
        run: cargo test --release --lib 2>&1 | tee test_unit.log

      - name: Integration tests
        run: cargo test --release --test '*' 2>&1 | tee test_integration.log

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: test_*.log
          retention-days: 7

  lint:
    name: Lint and Format
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt -- --check 2>&1 | tee fmt_check.log || true

      - name: Clippy lint
        run: cargo clippy --release --all-targets --all-features -- -D warnings 2>&1 | tee clippy.log || true

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: "*.log"
          retention-days: 7

  summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [build, test, lint]
    if: always()

    steps:
      - name: Report
        run: |
          echo "MEMORY_P Build Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "Build: ${{ needs.build.result }}" >> $GITHUB_STEP_SUMMARY
          echo "Tests: ${{ needs.test.result }}" >> $GITHUB_STEP_SUMMARY
          echo "Lint: ${{ needs.lint.result }}" >> $GITHUB_STEP_SUMMARY
