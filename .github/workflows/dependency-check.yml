name: Dependency Check & Auto-Update

on:
  schedule:
    - cron: '0 2 * * *'  # Daily at 2 AM UTC
  push:
    branches: [ main, develop ]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check-dependencies:
    name: Check Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      
      - name: Install cargo-outdated
        run: cargo install cargo-outdated
      
      - name: Check outdated dependencies
        id: outdated
        run: |
          cargo outdated --format json > outdated.json
          cat outdated.json
          echo "## Outdated Dependencies" >> $GITHUB_STEP_SUMMARY
          cargo outdated >> $GITHUB_STEP_SUMMARY
        continue-on-error: true
      
      - name: Upload outdated report
        uses: actions/upload-artifact@v6
        with:
          name: outdated-dependencies
          path: outdated.json
      
      - name: Install cargo-audit
        run: cargo install cargo-audit
      
      - name: Audit dependencies for vulnerabilities
        id: audit
        run: |
          cargo audit --json > audit.json
          cat audit.json
          echo "## Security Audit" >> $GITHUB_STEP_SUMMARY
          cargo audit >> $GITHUB_STEP_SUMMARY
        continue-on-error: true
      
      - name: Upload audit report
        uses: actions/upload-artifact@v6
        with:
          name: security-audit
          path: audit.json

  auto-update-dependencies:
    name: Auto-Update Dependencies
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      
      - name: Install cargo-edit
        run: cargo install cargo-edit
      
      - name: Update patch versions
        id: update
        run: |
          cargo update
          git diff Cargo.lock > changes.diff
          
          if [ -s changes.diff ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "## Dependency Updates" >> $GITHUB_STEP_SUMMARY
            cat changes.diff >> $GITHUB_STEP_SUMMARY
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No dependency updates needed" >> $GITHUB_STEP_SUMMARY
          fi
      
      - name: Run tests with updated dependencies
        if: steps.update.outputs.has_changes == 'true'
        run: cargo test --all-features
        continue-on-error: true
        id: test
      
      - name: Create PR with updates
        if: steps.update.outputs.has_changes == 'true' && steps.test.outcome == 'success'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore: update dependencies (patch versions)'
          title: '🔄 Auto-update: Patch dependency updates'
          body: |
            🤖 **Automated Dependency Updates**
            
            This PR updates patch versions of dependencies to their latest compatible versions.
            
            **Changes:**
            - Updated `Cargo.lock` with latest patch versions
            - All tests passed ✅
            
            **Generated by:** GitHub Actions
          branch: auto-update/dependencies
          labels: |
            dependencies
            automated
            auto-merge

  check-critical-vulnerabilities:
    name: Check Critical Vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      
      - name: Install cargo-audit
        run: cargo install cargo-audit
      
      - name: Check for critical vulnerabilities
        id: critical
        run: |
          if cargo audit --deny warnings; then
            echo "critical=false" >> $GITHUB_OUTPUT
            echo "✅ No critical vulnerabilities found" >> $GITHUB_STEP_SUMMARY
          else
            echo "critical=true" >> $GITHUB_OUTPUT
            echo "⚠️ Critical vulnerabilities detected!" >> $GITHUB_STEP_SUMMARY
          fi
        continue-on-error: true
      
      - name: Create issue for critical vulnerabilities
        if: steps.critical.outputs.critical == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const title = '🚨 Critical Security Vulnerabilities Detected';
            const body = `## Critical Security Alert
            
            Critical vulnerabilities have been detected in project dependencies.
            
            **Action Required:**
            1. Review the security audit report
            2. Update affected dependencies
            3. Run tests to ensure compatibility
            4. Deploy fixes immediately
            
            **Audit Report:**
            Run \`cargo audit\` for detailed information.
            
            **Auto-generated by:** Security Audit Workflow
            **Date:** ${new Date().toISOString()}`;
            
            // Check if similar issue exists
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'security,critical'
            });
            
            const existingIssue = issues.find(issue => issue.title.includes('Critical Security Vulnerabilities'));
            
            if (!existingIssue) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['security', 'critical', 'automated']
              });
              console.log('Created new security issue');
            } else {
              console.log('Security issue already exists');
            }
