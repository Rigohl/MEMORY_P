name: Metrics & Performance Tracking

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    - cron: '0 0 * * 0'  # Weekly on Sundays
  workflow_dispatch:

env:
  MCP_PROTOCOL_VERSION: "2024-11-05"

jobs:
  performance-benchmarks:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      
      - name: Cache cargo
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-bench-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Install criterion
        run: |
          if ! grep -q "criterion" Cargo.toml; then
            echo "No benchmarks configured, skipping..."
            exit 0
          fi
      
      - name: Run benchmarks
        run: |
          if [ -d "benches" ]; then
            cargo bench --all-features -- --output-format bencher | tee benchmark-results.txt
          else
            echo "## Benchmarks" >> $GITHUB_STEP_SUMMARY
            echo "No benchmark directory found. To add benchmarks:" >> $GITHUB_STEP_SUMMARY
            echo '```toml' >> $GITHUB_STEP_SUMMARY
            echo '[dev-dependencies]' >> $GITHUB_STEP_SUMMARY
            echo 'criterion = "0.5"' >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

  build-time-tracking:
    name: Build Time Tracking
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      
      - name: Measure build time
        run: |
          echo "## Build Time Metrics" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          start_time=$(date +%s)
          cargo build --release --all-features
          end_time=$(date +%s)
          
          duration=$((end_time - start_time))
          echo "**Full Release Build:** ${duration}s" >> $GITHUB_STEP_SUMMARY
          
          start_time=$(date +%s)
          cargo build --all-features
          end_time=$(date +%s)
          
          duration=$((end_time - start_time))
          echo "**Debug Build:** ${duration}s" >> $GITHUB_STEP_SUMMARY

  test-execution-time:
    name: Test Execution Time
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      
      - name: Measure test time
        run: |
          echo "## Test Execution Metrics" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          start_time=$(date +%s)
          cargo test --all-features 2>&1 | tee test-output.txt
          end_time=$(date +%s)
          
          duration=$((end_time - start_time))
          test_count=$(grep -oP '\d+(?= passed)' test-output.txt | head -1 || echo "0")
          
          echo "**Total Tests:** ${test_count}" >> $GITHUB_STEP_SUMMARY
          echo "**Execution Time:** ${duration}s" >> $GITHUB_STEP_SUMMARY
          
          if [ "$test_count" -gt 0 ]; then
            avg_time=$(echo "scale=2; $duration / $test_count" | bc)
            echo "**Average per Test:** ${avg_time}s" >> $GITHUB_STEP_SUMMARY
          fi

  code-quality-metrics:
    name: Code Quality Metrics
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install tokei
        run: cargo install tokei
      
      - name: Generate code statistics
        run: |
          tokei . --output json > tokei.json
          
          echo "## Code Statistics" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          tokei . >> $GITHUB_STEP_SUMMARY
      
      - name: Count tests
        run: |
          test_count=$(grep -r "#\[test\]" src/ --include="*.rs" | wc -l)
          cfg_test_count=$(grep -r "#\[cfg(test)\]" src/ --include="*.rs" | wc -l)
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Test Coverage Indicators:**" >> $GITHUB_STEP_SUMMARY
          echo "- Test functions: ${test_count}" >> $GITHUB_STEP_SUMMARY
          echo "- Test modules: ${cfg_test_count}" >> $GITHUB_STEP_SUMMARY
      
      - name: Upload statistics
        uses: actions/upload-artifact@v4
        with:
          name: code-statistics
          path: tokei.json

  dependency-metrics:
    name: Dependency Metrics
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      
      - name: Analyze dependencies
        run: |
          echo "## Dependency Metrics" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          direct_deps=$(grep -c "^[a-z]" Cargo.toml || echo "0")
          echo "**Direct Dependencies:** ${direct_deps}" >> $GITHUB_STEP_SUMMARY
          
          cargo tree --depth 1 > tree.txt
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Top-level Dependency Tree:**" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          head -20 tree.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  motor-engine-metrics:
    name: Motor Engine Metrics
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Measure motor implementations
        run: |
          echo "## Motor Architecture Metrics" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          for motor in qdrant faiss scann tantivy lnx toshi meilisearch julia_nlp memory_bank; do
            count=$(find src/motores -name "*$motor*" -type f 2>/dev/null | wc -l)
            if [ $count -gt 0 ]; then
              lines=$(find src/motores -name "*$motor*" -type f -exec wc -l {} + 2>/dev/null | tail -1 | awk '{print $1}')
              echo "- **$motor**: $lines LOC ($count files)" >> $GITHUB_STEP_SUMMARY
            fi
          done
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**SearchEngine Implementations:** $(grep -r "impl SearchEngine" src/motores --include="*.rs" 2>/dev/null | wc -l)" >> $GITHUB_STEP_SUMMARY

  ffi-integration-metrics:
    name: FFI Integration Metrics
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Measure FFI bridges and BRAIN
        run: |
          echo "## FFI & BRAIN Metrics" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**FFI Bridges:**" >> $GITHUB_STEP_SUMMARY
          
          for lang in zig julia mojo jax pony; do
            if [ -f "src/ffi/$lang.rs" ]; then
              lines=$(wc -l < "src/ffi/$lang.rs" 2>/dev/null)
              funcs=$(grep -c "pub fn\|pub async fn" "src/ffi/$lang.rs" 2>/dev/null || echo "0")
              echo "- **$lang**: $lines LOC, $funcs functions" >> $GITHUB_STEP_SUMMARY
            fi
          done
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**BRAIN Components:**" >> $GITHUB_STEP_SUMMARY
          
          for dir in brain/julia brain/mojo brain/python brain/pony brain/zig; do
            if [ -d "$dir" ]; then
              files=$(find "$dir" -type f 2>/dev/null | wc -l)
              lines=$(find "$dir" -type f -exec wc -l {} + 2>/dev/null | tail -1 | awk '{print $1}' || echo "0")
              echo "- **${dir##*/}**: $lines LOC ($files files)" >> $GITHUB_STEP_SUMMARY
            fi
          done

  database-schema-metrics:
    name: Database & Schema Metrics
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: memory_p
          POSTGRES_PASSWORD: memory_p
          POSTGRES_DB: memory_p_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      
      - name: Validate database schema and collect metrics
        run: |
          echo "## Database & Schema Metrics" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Check if init.sql exists
          if [ -f "config/init.sql" ]; then
            sql_lines=$(wc -l < "config/init.sql")
            echo "- **SQL Schema File:** $sql_lines lines" >> $GITHUB_STEP_SUMMARY
            
            # Count tables, indexes, etc.
            tables=$(grep -ic "CREATE TABLE" config/init.sql || echo "0")
            indexes=$(grep -ic "CREATE INDEX" config/init.sql || echo "0")
            extensions=$(grep -ic "CREATE EXTENSION\|CREATE SCHEMA" config/init.sql || echo "0")
            
            echo "- **Tables:** $tables" >> $GITHUB_STEP_SUMMARY
            echo "- **Indexes:** $indexes" >> $GITHUB_STEP_SUMMARY
            echo "- **Extensions/Schemas:** $extensions" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ No config/init.sql found" >> $GITHUB_STEP_SUMMARY
          fi
          
          # Check migrations if they exist
          if [ -d "migrations" ]; then
            migration_count=$(find migrations -type f 2>/dev/null | wc -l)
            echo "- **Migrations:** $migration_count files" >> $GITHUB_STEP_SUMMARY
          fi

  metrics-summary:
    name: Metrics Dashboard
    needs: [performance-benchmarks, build-time-tracking, test-execution-time, code-quality-metrics, dependency-metrics, motor-engine-metrics, ffi-integration-metrics, database-schema-metrics]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - uses: actions/checkout@v4
      
      - name: Create comprehensive dashboard
        run: |
          echo "# 📊 MEMORY_P v2.0 Metrics Dashboard" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Generated:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> $GITHUB_STEP_SUMMARY
          echo "**Repository:** ${{ github.repository }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## System Overview" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ **All Metrics Collected Successfully**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Sections:" >> $GITHUB_STEP_SUMMARY
          echo "- Performance & Benchmarks" >> $GITHUB_STEP_SUMMARY
          echo "- Build Metrics" >> $GITHUB_STEP_SUMMARY
          echo "- Test Coverage" >> $GITHUB_STEP_SUMMARY
          echo "- Code Quality" >> $GITHUB_STEP_SUMMARY
          echo "- Dependencies" >> $GITHUB_STEP_SUMMARY
          echo "- Motor Architecture" >> $GITHUB_STEP_SUMMARY
          echo "- FFI Integration" >> $GITHUB_STEP_SUMMARY
          echo "- Database Schema" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Job Status" >> $GITHUB_STEP_SUMMARY
          echo "- 🏃 Performance Benchmarks: ${{ needs.performance-benchmarks.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- ⏱️ Build Time Tracking: ${{ needs.build-time-tracking.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- 🧪 Test Execution: ${{ needs.test-execution-time.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- 📈 Code Quality: ${{ needs.code-quality-metrics.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- 📦 Dependencies: ${{ needs.dependency-metrics.result }}" >> $GITHUB_STEP_SUMMARY
