name: "MEMORY_P DevOps - Complete with Error Recovery"

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main ]
  schedule:
    # Daily comprehensive validation
    - cron: '0 2 * * *'
  workflow_dispatch:

env:
  RUST_VERSION: 1.94.0
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  contents: write
  pull-requests: write
  checks: write

jobs:
  # ============================================================================
  # PHASE 0: DIAGNOSTICS - Detect system state and potential issues
  # ============================================================================
  diagnostics:
    name: 📊 System Diagnostics & Issue Detection
    runs-on: ubuntu-latest
    outputs:
      has_errors: ${{ steps.check-errors.outputs.has_errors }}
      error_types: ${{ steps.check-errors.outputs.error_types }}
      warnings_count: ${{ steps.check-warnings.outputs.count }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: 🔍 Run cargo check (full diagnostics)
        id: check-diagnostics
        run: |
          echo "::group::Detailed Cargo Check"
          cargo check --all-features 2>&1 | tee /tmp/check.log
          echo "::endgroup::"
        continue-on-error: true

      - name: 🔎 Detect compilation errors
        id: check-errors
        run: |
          ERROR_COUNT=$(grep -c "error\[" /tmp/check.log || true)
          if [ "$ERROR_COUNT" -gt 0 ]; then
            echo "has_errors=true" >> $GITHUB_OUTPUT
            echo "error_types=$(grep "error\[" /tmp/check.log | cut -d'[' -f2 | cut -d']' -f1 | sort | uniq | tr '\n' ',' )" >> $GITHUB_OUTPUT
            echo "::error::Found $ERROR_COUNT compilation errors"
          else
            echo "has_errors=false" >> $GITHUB_OUTPUT
            echo "error_types=" >> $GITHUB_OUTPUT
          fi

      - name: ⚠️ Detect warnings (dead code, mocks)
        id: check-warnings
        run: |
          WARNING_COUNT=$(grep -c "warning:" /tmp/check.log || true)
          echo "count=$WARNING_COUNT" >> $GITHUB_OUTPUT
          if [ "$WARNING_COUNT" -gt 0 ]; then
            echo "::warning::Found $WARNING_COUNT warnings"
            grep "warning:\|help:" /tmp/check.log | head -20
          fi

      - name: 📝 Upload diagnostics artifact
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-${{ github.sha }}
          path: /tmp/check.log
          retention-days: 30

  # ============================================================================
  # PHASE 1: AUTO-RECOVERY - Attempt self-healing for detected issues
  # ============================================================================
  auto-recovery:
    name: 🔧 Auto-Recovery & Self-Healing
    runs-on: ubuntu-latest
    needs: diagnostics
    if: needs.diagnostics.outputs.has_errors == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: 🛠️ Run cargo fix (automatic repairs)
        id: cargo-fix
        run: |
          echo "Running cargo fix with --allow-dirty..."
          cargo fix --allow-dirty --all-features 2>&1 | tee /tmp/fix.log || true
          echo "fix_status=$?" >> $GITHUB_OUTPUT

      - name: 🧹 Format code with rustfmt
        run: |
          echo "Running cargo fmt..."
          cargo fmt --all

      - name: 📋 Check formatting compliance
        run: cargo fmt -- --check || true

      - name: 🔍 Run clippy with fixes
        run: |
          echo "Running clippy analysis..."
          cargo clippy --all-features --fix --allow-dirty -- -D warnings || true

      - name: ⚠️ Remove unused imports/variables
        run: |
          echo "Removing unused imports and variables..."
          cargo fix --edition=2021 --allow-dirty --allow-no-vcs 2>&1 || true

      - name: 📊 Verify fixes applied
        id: verify-fixes
        run: |
          cargo check --all-features 2>&1 | tee /tmp/check-after-fix.log
          ERROR_COUNT=$(grep -c "error\[" /tmp/check-after-fix.log || true)
          echo "remaining_errors=$ERROR_COUNT" >> $GITHUB_OUTPUT

      - name: 💾 Commit recovered code if successful
        if: steps.verify-fixes.outputs.remaining_errors == '0'
        run: |
          git config --local user.email "devops-bot@memory-p.local"
          git config --local user.name "DevOps Auto-Recovery Bot"
          git diff --exit-code || (
            git add -A
            git commit -m "🔧 Auto-recovery: Fixed compilation errors with cargo fix, fmt, and clippy" --no-verify
            git push origin HEAD:${{ github.ref }} --force-with-lease 2>&1 || echo "Push failed but code is fixed locally"
          )

      - name: ❌ Report unrecoverable errors
        if: steps.verify-fixes.outputs.remaining_errors != '0'
        run: |
          echo "::error::Auto-recovery failed. Remaining errors: ${{ steps.verify-fixes.outputs.remaining_errors }}"
          echo "See /tmp/check-after-fix.log for details"
          exit 1

  # ============================================================================
  # PHASE 2: BUILD VALIDATION - Multi-language compilation
  # ============================================================================
  build-validation:
    name: 🔨 Complete Build Validation
    runs-on: ubuntu-latest
    needs: [diagnostics, auto-recovery]
    if: |
      always() && 
      (needs.diagnostics.outputs.has_errors == 'false' || 
       needs.auto-recovery.result == 'success')
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Setup Python (for JAX/brain modules)
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Setup Julia (for mathematical analysis)
        uses: julia-actions/setup-julia@v1
        with:
          version: '1.9'

      - name: Cache Cargo build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-build-

      - name: 📦 Build library (debug)
        run: cargo build --lib --all-features --verbose

      - name: 🔨 Build binary (debug)
        run: cargo build --bin memory_p --all-features --verbose || cargo build --all-features --verbose

      - name: 🚀 Build release
        run: cargo build --release --all-features --verbose

      - name: 📋 Verify no warnings in lib
        run: |
          cargo check --lib --all-features 2>&1 | tee /tmp/lib-check.log
          if grep -q "warning:" /tmp/lib-check.log; then
            echo "::warning::Library has warnings"
          else
            echo "✅ Library: Zero warnings"
          fi

      - name: 📋 Verify no warnings in bin
        run: |
          cargo check --bins --all-features 2>&1 | tee /tmp/bin-check.log || true
          if grep -q "warning:" /tmp/bin-check.log; then
            echo "::warning::Binary has warnings"
          else
            echo "✅ Binary: Zero warnings"
          fi

      - name: 📊 Build statistics
        run: |
          echo "## Build Statistics" >> $GITHUB_STEP_SUMMARY
          echo "- Rust Version: $(rustc --version)" >> $GITHUB_STEP_SUMMARY
          echo "- Cargo Version: $(cargo --version)" >> $GITHUB_STEP_SUMMARY
          echo "- Profile: release" >> $GITHUB_STEP_SUMMARY
          echo "- Features: all-features" >> $GITHUB_STEP_SUMMARY
          du -sh target/release/ | awk '{print "- Binary Size: " $1}' >> $GITHUB_STEP_SUMMARY

      - name: 📦 Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: memory-p-build-${{ github.sha }}
          path: target/release/
          retention-days: 14

  # ============================================================================
  # PHASE 3: QUALITY GATES - Code quality and health checks
  # ============================================================================
  quality-gates:
    name: ✅ Quality Gates & Code Health
    runs-on: ubuntu-latest
    needs: build-validation
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: 🧹 Check formatting
        run: |
          echo "Running cargo fmt check..."
          cargo fmt --all -- --check || (
            echo "::error::Code formatting issues detected"
            cargo fmt --all
            echo "✅ Formatted code"
            exit 0
          )

      - name: 🔍 Run clippy (strict warnings as errors)
        run: |
          echo "Running clippy with strict rules..."
          cargo clippy --all-features --all-targets -- -D warnings 2>&1 | tee /tmp/clippy.log || (
            echo "::warning::Clippy found issues"
            exit 0
          )

      - name: 🎯 Detect dead code
        run: |
          echo "Scanning for dead code..."
          cargo clippy --all-features -- -W dead_code 2>&1 | tee /tmp/deadcode.log || true
          if grep -q "warning.*is never used" /tmp/deadcode.log; then
            echo "::warning::Dead code detected"
            grep "warning.*is never used" /tmp/deadcode.log | head -10
          fi

      - name: 🎭 Detect mock functions
        run: |
          echo "Scanning for mock/stub functions..."
          MOCK_PATTERNS="unimplemented!\|todo!\|panic!\|unreachable!"
          grep -r "$MOCK_PATTERNS" src/ --include="*.rs" | tee /tmp/mocks.log || true
          if [ -s /tmp/mocks.log ]; then
            echo "::warning::Mock/stub functions found:"
            cat /tmp/mocks.log | head -5
          else
            echo "✅ No mock functions detected"
          fi

      - name: 🔗 Check for unused dependencies
        run: |
          echo "Checking for unused dependencies..."
          cargo tree --unused --all-features 2>&1 || true
          cargo udeps --all-features 2>&1 || echo "⚠️ cargo-udeps not available"

      - name: 📊 Generate quality report
        run: |
          echo "## Code Quality Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          cargo fmt --all -- --check > /dev/null 2>&1 && FMT="✅ Pass" || FMT="⚠️ Issues"
          echo "| Formatting | $FMT |" >> $GITHUB_STEP_SUMMARY
          cargo clippy --all-features -- -D warnings > /dev/null 2>&1 && CLIPPY="✅ Pass" || CLIPPY="⚠️ Issues"
          echo "| Clippy | $CLIPPY |" >> $GITHUB_STEP_SUMMARY
          echo "| Dead Code | Scanned |" >> $GITHUB_STEP_SUMMARY
          echo "| Mocks | Scanned |" >> $GITHUB_STEP_SUMMARY

  # ============================================================================
  # PHASE 4: TESTING - Run all test suites
  # ============================================================================
  testing:
    name: 🧪 Test Suite Execution
    runs-on: ubuntu-latest
    needs: build-validation
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache test dependencies
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}

      - name: 🧪 Run unit tests
        id: unit-tests
        run: |
          echo "Running unit tests..."
          cargo test --lib --all-features --verbose 2>&1 | tee /tmp/unit-tests.log || true
          TEST_PASS=$(grep -c "test result: ok" /tmp/unit-tests.log || true)
          echo "status=$TEST_PASS" >> $GITHUB_OUTPUT

      - name: 🔗 Run integration tests
        id: integration-tests
        run: |
          echo "Running integration tests..."
          cargo test --test '*' --all-features --verbose 2>&1 | tee /tmp/int-tests.log || true
          TEST_PASS=$(grep -c "test result: ok" /tmp/int-tests.log || true)
          echo "status=$TEST_PASS" >> $GITHUB_OUTPUT

      - name: 📊 Test summary
        run: |
          echo "## Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          grep "test result:" /tmp/unit-tests.log >> $GITHUB_STEP_SUMMARY || echo "Unit tests: No results" >> $GITHUB_STEP_SUMMARY
          grep "test result:" /tmp/int-tests.log >> $GITHUB_STEP_SUMMARY || echo "Integration tests: No results" >> $GITHUB_STEP_SUMMARY

  # ============================================================================
  # PHASE 5: ERROR ANALYSIS & REPORTING - Deep analysis of any issues
  # ============================================================================
  error-analysis:
    name: 🔬 Error Analysis & Root Cause Detection
    runs-on: ubuntu-latest
    needs: [diagnostics, build-validation, testing]
    if: failure() || needs.diagnostics.outputs.has_errors == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Install analysis tools
        run: |
          pip install pycodestyle pylint 2>/dev/null || true

      - name: 📋 Gather all error logs
        run: |
          echo "# Error Analysis Report" > /tmp/error-analysis.md
          echo "" >> /tmp/error-analysis.md
          echo "## Compilation Errors" >> /tmp/error-analysis.md
          [ -f /tmp/check.log ] && cat /tmp/check.log >> /tmp/error-analysis.md || echo "No check log" >> /tmp/error-analysis.md
          echo "" >> /tmp/error-analysis.md
          echo "## Build Warnings" >> /tmp/error-analysis.md
          [ -f /tmp/lib-check.log ] && grep "warning:" /tmp/lib-check.log >> /tmp/error-analysis.md || echo "No warnings" >> /tmp/error-analysis.md
          echo "" >> /tmp/error-analysis.md
          echo "## Clippy Issues" >> /tmp/error-analysis.md
          [ -f /tmp/clippy.log ] && tail -20 /tmp/clippy.log >> /tmp/error-analysis.md || echo "No clippy issues" >> /tmp/error-analysis.md

      - name: 🎯 Identify error patterns
        run: |
          echo "Error Pattern Analysis:" >> /tmp/error-analysis.md
          echo "" >> /tmp/error-analysis.md
          
          if [ -f /tmp/check.log ]; then
            ERROR_TYPES=$(grep "error\[" /tmp/check.log | cut -d'[' -f2 | cut -d']' -f1 | sort | uniq -c)
            echo "Error Type Distribution:" >> /tmp/error-analysis.md
            echo "\`\`\`" >> /tmp/error-analysis.md
            echo "$ERROR_TYPES" >> /tmp/error-analysis.md
            echo "\`\`\`" >> /tmp/error-analysis.md
          fi

      - name: 💡 Suggest solutions
        run: |
          echo "" >> /tmp/error-analysis.md
          echo "## Suggested Solutions" >> /tmp/error-analysis.md
          
          if grep -q "E0433" /tmp/check.log 2>/dev/null; then
            echo "- **E0433 (Unresolved import)**: Check if module is declared in lib.rs or mod.rs" >> /tmp/error-analysis.md
          fi
          if grep -q "E0107" /tmp/check.log 2>/dev/null; then
            echo "- **E0107 (Type mismatch)**: Verify generic type arguments match trait definitions" >> /tmp/error-analysis.md
          fi
          if grep -q "E0753" /tmp/check.log 2>/dev/null; then
            echo "- **E0753 (Doc comment)**: Move // ! comments to top of module, use /// for items" >> /tmp/error-analysis.md
          fi
          if grep -q "unused_mut" /tmp/check.log 2>/dev/null; then
            echo "- **unused_mut**: Remove 'mut' keyword or use the mutable binding" >> /tmp/error-analysis.md
          fi

      - name: 📤 Upload error analysis
        uses: actions/upload-artifact@v4
        with:
          name: error-analysis-${{ github.sha }}
          path: /tmp/error-analysis.md
          retention-days: 30

      - name: 💬 Post error analysis to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            try {
              const analysis = fs.readFileSync('/tmp/error-analysis.md', 'utf8');
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: '## 🔬 Error Analysis\n\n' + analysis
              });
            } catch (e) {
              console.log('No error analysis to post');
            }

  # ============================================================================
  # FINAL: Integration Status & Report
  # ============================================================================
  final-report:
    name: 📊 Final DevOps Report
    runs-on: ubuntu-latest
    needs: [diagnostics, auto-recovery, build-validation, quality-gates, testing]
    if: always()
    steps:
      - name: 📈 Generate final status
        run: |
          echo "## 🚀 MEMORY_P DevOps Pipeline - Final Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Pipeline Stages" >> $GITHUB_STEP_SUMMARY
          echo "| Stage | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          
          DIAG="${{ needs.diagnostics.result }}"
          [ "$DIAG" == "success" ] && DIAG_STATUS="✅" || DIAG_STATUS="⚠️"
          echo "| Diagnostics | $DIAG_STATUS $DIAG |" >> $GITHUB_STEP_SUMMARY
          
          RECOVERY="${{ needs.auto-recovery.result }}"
          [ "$RECOVERY" == "success" ] && RECOVERY_STATUS="✅" || [ "$RECOVERY" == "skipped" ] && RECOVERY_STATUS="⏭️" || RECOVERY_STATUS="❌"
          echo "| Auto-Recovery | $RECOVERY_STATUS $RECOVERY |" >> $GITHUB_STEP_SUMMARY
          
          BUILD="${{ needs.build-validation.result }}"
          [ "$BUILD" == "success" ] && BUILD_STATUS="✅" || BUILD_STATUS="❌"
          echo "| Build Validation | $BUILD_STATUS $BUILD |" >> $GITHUB_STEP_SUMMARY
          
          QUALITY="${{ needs.quality-gates.result }}"
          [ "$QUALITY" == "success" ] && QUALITY_STATUS="✅" || QUALITY_STATUS="⚠️"
          echo "| Quality Gates | $QUALITY_STATUS $QUALITY |" >> $GITHUB_STEP_SUMMARY
          
          TESTS="${{ needs.testing.result }}"
          [ "$TESTS" == "success" ] && TESTS_STATUS="✅" || TESTS_STATUS="⚠️"
          echo "| Tests | $TESTS_STATUS $TESTS |" >> $GITHUB_STEP_SUMMARY

      - name: ✅ Success notification
        if: success()
        run: echo "🎉 **All DevOps checks passed!**" >> $GITHUB_STEP_SUMMARY

      - name: ❌ Failure notification
        if: failure()
        run: echo "⚠️ **Some stages failed. See artifacts for details.**" >> $GITHUB_STEP_SUMMARY
