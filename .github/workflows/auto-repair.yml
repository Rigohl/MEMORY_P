name: Auto-Repair on PR

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

env:
  MCP_PROTOCOL_VERSION: "2024-11-05"

jobs:
  mcp-validation:
    name: 🔌 MCP 2024-11-05 Protocol Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify MCP compliance before repair
        run: |
          echo "🔍 Ensuring MCP 2024-11-05 during repair..."
          grep -r "2024-11-05" src/mcp/ 2>/dev/null && echo "✅ MCP protocol verified" || true

  auto-repair:
    name: Automatic Code Repair
    runs-on: ubuntu-latest
    needs: mcp-validation
    
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Build JAR CLI
        run: cargo build --bin jar --release
      
      - name: Run Auto-Repair (Format)
        run: ./target/release/jar repair --format --fix-deps
        continue-on-error: true
      
      - name: Check for changes
        id: verify-changed-files
        run: |
          git diff --exit-code || echo "changed=true" >> $GITHUB_OUTPUT
      
      - name: Commit and push if changed
        if: steps.verify-changed-files.outputs.changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A
          git commit -m "🤖 Auto-repair: Format code and update dependencies"
          git push
      
      - name: Comment on PR
        if: steps.verify-changed-files.outputs.changed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '🤖 **Auto-Repair Applied**\n\nThe code has been automatically formatted and dependencies updated.'
            })
